<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeadAMP Desktop Audio</title>
<link rel="stylesheet" href="/vendor/webamp-modern/css/webamp.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
body{font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;user-select:none}
#headampModernHost{position:absolute;inset:0;z-index:10;opacity:0;pointer-events:none;overflow:hidden}
#headampModernHost>*{pointer-events:auto}
#headampModernHost ui-root,#headampModernHost [id^="ui-root-"]{pointer-events:auto}
#classicEqHost{position:absolute;left:770px;top:8px;width:275px;height:116px;z-index:30}
#headampModernStatus{
  position:absolute;left:770px;top:128px;z-index:31;max-width:270px;
  padding:3px 6px;background:#000;color:#8cff61;border:1px solid #4d8d35;
  font:10px/1.25 Consolas,"Courier New",monospace
}
#headampModernStatus.ok{opacity:.72}
#headampModernStatus.error{color:#ff9696;border-color:#aa3333;opacity:1}
#headampOverlay{position:absolute;inset:0;z-index:40;pointer-events:none}
</style>
</head>
<body>
<div id="headampModernHost"></div>
<div id="classicEqHost"></div>
<div id="headampModernStatus">HEADAMP // STARTING...</div>
<div id="headampOverlay"></div>

<template id="overlayTemplate">
<style>
*{box-sizing:border-box}
#fallbackHead{
  position:absolute;left:0;top:0;width:796px;height:424px;
  pointer-events:auto;display:block;overflow:hidden;z-index:4;
  filter:drop-shadow(2px 3px 2px rgba(0,0,0,.35));
}
#fallbackHead.visible{display:block}
#headArt{position:absolute;inset:0;width:796px;height:424px;display:block;pointer-events:none}
#faceVis{
  position:absolute;left:10px;top:60px;width:214px;height:154px;
  border:0;border-radius:26px 26px 34px 34px;background:#000;
  image-rendering:pixelated;cursor:pointer
}
.hot{
  position:absolute;border:0!important;background:transparent!important;padding:0!important;
  width:21px;height:21px;cursor:pointer;outline:none
}
.hot:hover{outline:1px dotted rgba(255,255,255,.55)}
#prevHot{left:45px;top:27px}
#playHot{left:70px;top:27px}
#stopHot{left:95px;top:27px}
#nextHot{left:120px;top:27px}
#visHot{left:165px;top:27px}
#fallbackLabel{
  position:absolute;left:17px;right:17px;bottom:4px;color:#aaff71;
  font:9px/1.1 Consolas,monospace;text-align:center;text-shadow:1px 1px #000;
  opacity:.75;pointer-events:none
}
#palette{
  position:absolute;left:770px;top:154px;width:275px;pointer-events:auto;
  background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;
  box-shadow:2px 2px rgba(0,0,0,.45);color:#000;
  font:11px/1.2 "MS Sans Serif",Tahoma,Arial,sans-serif;z-index:6
}
.title{
  height:19px;background:#000080;color:#fff;font-weight:bold;padding:2px 4px;
  display:flex;align-items:center;justify-content:space-between
}
.body{padding:6px}
select,button{
  font:11px "MS Sans Serif",Tahoma,Arial,sans-serif!important;color:#000!important;
  position:static!important;transform:none!important
}
select{
  width:100%!important;height:23px!important;margin:0 0 5px!important;
  border:2px inset #ddd!important;background:#fff!important
}
.row{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.winbtn{
  min-height:23px!important;padding:2px 7px!important;background:#c0c0c0!important;
  border:2px solid!important;border-color:#fff #404040 #404040 #fff!important;
  box-shadow:none!important;cursor:pointer!important
}
.winbtn:active{border-color:#404040 #fff #fff #404040!important}
#meta{margin:2px 0 5px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tracks{
  height:132px;overflow:auto;background:#fff;border:2px inset #ddd;padding:2px;
  font:11px/1.15 "MS Sans Serif",Tahoma,Arial,sans-serif
}
.track{
  display:block!important;position:static!important;width:100%!important;min-height:18px!important;
  text-align:left!important;border:0!important;background:#fff!important;color:#000!important;
  padding:2px 3px!important;margin:0!important;cursor:pointer!important
}
.track:hover,.track.active{background:#000080!important;color:#fff!important}
#drop{
  margin-top:6px;padding:5px;border:2px inset #ddd;background:#fff;text-align:center;color:#333;
  min-height:30px
}
#drop.drag{background:#000080;color:#fff}
#folder{display:none}
#renderState{margin-top:4px;font-size:10px;color:#555}
</style>

<div id="fallbackHead" aria-label="HeadAMP fallback player">
  <img id="headArt" alt="">
  <canvas id="faceVis" width="214" height="154" title="Click to switch spectrum / oscilloscope"></canvas>
  <button class="hot" id="prevHot" title="Previous"></button>
  <button class="hot" id="playHot" title="Play / Pause"></button>
  <button class="hot" id="stopHot" title="Stop"></button>
  <button class="hot" id="nextHot" title="Next"></button>
  <button class="hot" id="visHot" title="Spectrum / Oscilloscope"></button>
  <div id="fallbackLabel">HEADAMP FALLBACK // EXACT SKIN ART</div>
</div>

<div id="palette">
  <div class="title"><span>HeadAMP Playlist Library</span><span>♪</span></div>
  <div class="body">
    <select id="playlist"></select>
    <div id="meta">Waiting for HeadAMP...</div>
    <div id="tracks"></div>

    <div class="row">
      <button class="winbtn" id="prev">|◀</button>
      <button class="winbtn" id="play">▶ / ❚❚</button>
      <button class="winbtn" id="stop">■</button>
      <button class="winbtn" id="next">▶|</button>
    </div>

    <div class="row">
      <button class="winbtn" id="spectrum">Spectrum</button>
      <button class="winbtn" id="scope">Scope</button>
      <button class="winbtn" id="folderBtn">Load Folder...</button>
    </div>

    <div id="drop">Drop .IT / .MOD / .XM / .S3M folder here</div>
    <input id="folder" type="file" multiple webkitdirectory>
    <div id="renderState">WAL renderer: loading…</div>
  </div>
</div>
</template>

<script type="module">
const overlayHost=document.getElementById("headampOverlay");
const shadow=overlayHost.attachShadow({mode:"open"});
shadow.append(document.getElementById("overlayTemplate").content.cloneNode(true));

const $=id=>shadow.getElementById(id);
const playlist=$("playlist");
const meta=$("meta");
const tracks=$("tracks");
const folder=$("folder");
const drop=$("drop");
const fallback=$("fallbackHead");
const headArt=$("headArt");
const canvas=$("faceVis");
const ctx=canvas.getContext("2d",{alpha:false});
const renderState=$("renderState");

let selectedTrack=-1;
let visMode="spectrum";
let analyser=null;
let freq=null;
let time=null;
let headObjectUrl="";

function api(){ return window.__headampPlaylist; }

function renderPlaylist(detail){
  meta.textContent=(detail.label||detail.id)+" // "+detail.count+" tracks";
  tracks.innerHTML="";
  selectedTrack=-1;

  (detail.tracks||[]).forEach((name,index)=>{
    const b=document.createElement("button");
    b.className="track";
    b.textContent=String(index+1).padStart(2,"0")+"  "+name;
    b.onclick=()=>{
      selectedTrack=index;
      [...tracks.children].forEach((x,i)=>x.classList.toggle("active",i===index));
      api()?.play(index);
    };
    tracks.appendChild(b);
  });
}

function populatePlaylists(){
  const a=api();
  if(!a) return;
  const list=a.list?.()||[];
  playlist.innerHTML="";
  list.forEach(p=>{
    const o=document.createElement("option");
    o.value=p.id;
    o.textContent=p.label||p.id;
    playlist.appendChild(o);
  });
  playlist.value=a.current?.()||list[0]?.id||"";
}

async function loadLocalFiles(files){
  if(!files?.length) return;
  const first=files[0];
  const rel=first.webkitRelativePath||"";
  const label=rel.includes("/") ? rel.split("/")[0] : "Local Playlist";
  try{
    const count=await api()?.loadFiles(files,label,false);
    if(count) meta.textContent=label+" // "+count+" local tracks";
  }catch(err){
    meta.textContent="LOAD ERROR // "+(err?.message||err);
  }
}

playlist.onchange=()=>api()?.load(playlist.value,false);
$("folderBtn").onclick=()=>folder.click();
folder.onchange=()=>loadLocalFiles(folder.files);

for(const type of ["dragenter","dragover"]){
  drop.addEventListener(type,e=>{e.preventDefault();drop.classList.add("drag")});
}
for(const type of ["dragleave","drop"]){
  drop.addEventListener(type,e=>{e.preventDefault();drop.classList.remove("drag")});
}
drop.addEventListener("drop",e=>loadLocalFiles(e.dataTransfer.files));

$("prev").onclick=()=>api()?.previous();
$("next").onclick=()=>api()?.next();
$("stop").onclick=()=>api()?.stop();
$("play").onclick=()=>{
  const a=api();
  if(!a) return;
  if(a.state?.()==="playing") a.pause?.();
  else a.playCurrent?.();
};

$("prevHot").onclick=()=>api()?.previous();
$("nextHot").onclick=()=>api()?.next();
$("stopHot").onclick=()=>api()?.stop();
$("playHot").onclick=()=>{
  const a=api();
  if(!a) return;
  if(a.state?.()==="playing") a.pause?.();
  else a.playCurrent?.();
};

function setVis(mode){
  visMode=mode;
  if(mode==="spectrum") window.__headampVis?.spectrum?.();
  else window.__headampVis?.oscilloscope?.();
}
$("spectrum").onclick=()=>setVis("spectrum");
$("scope").onclick=()=>setVis("oscilloscope");
$("visHot").onclick=()=>setVis(visMode==="spectrum"?"oscilloscope":"spectrum");
canvas.onclick=()=>setVis(visMode==="spectrum"?"oscilloscope":"spectrum");

function setAnalyser(a){
  analyser=a||null;
  if(analyser){
    freq=new Uint8Array(analyser.frequencyBinCount);
    time=new Uint8Array(analyser.fftSize);
  }
}
setAnalyser(window.__headampAnalyser);
window.addEventListener("headamp-analyser-ready",()=>setAnalyser(window.__headampAnalyser));

function bucket(i,count,bins){
  const min=1,max=Math.max(2,bins-1);
  const t=i/Math.max(1,count-1);
  return Math.min(max,Math.floor(min*Math.pow(max/min,t)));
}

function drawSpectrum(){
  const w=canvas.width,h=canvas.height;
  ctx.fillStyle="#000";ctx.fillRect(0,0,w,h);

  if(!analyser||!freq){
    ctx.fillStyle="#173b10";
    for(let x=6;x<w;x+=10) ctx.fillRect(x,h-6,4,1);
    return;
  }

  analyser.getByteFrequencyData(freq);
  const bars=24,gap=2,bw=Math.max(2,Math.floor((w-gap*(bars+1))/bars));

  for(let i=0;i<bars;i++){
    const a=bucket(i,bars,freq.length);
    const b=bucket(i+1,bars+1,freq.length);
    let amp=0;
    for(let k=a;k<=Math.max(a,b);k++) amp=Math.max(amp,freq[k]||0);
    const bh=Math.max(1,Math.round((amp/255)*(h-7)));
    const x=gap+i*(bw+gap);

    for(let y=0;y<bh;y+=3){
      const ratio=y/Math.max(1,bh);
      ctx.fillStyle=ratio>.73?"#f5ff7a":ratio>.45?"#87ff42":"#29c51c";
      ctx.fillRect(x,h-3-y,bw,2);
    }
  }
}

function drawScope(){
  const w=canvas.width,h=canvas.height;
  ctx.fillStyle="#000";ctx.fillRect(0,0,w,h);

  if(!analyser||!time){
    ctx.fillStyle="#76ff50";ctx.fillRect(0,Math.floor(h/2),w,1);return;
  }

  analyser.getByteTimeDomainData(time);
  ctx.strokeStyle="#79ff55";ctx.lineWidth=1;ctx.beginPath();
  const step=time.length/w;
  for(let x=0;x<w;x++){
    const sample=time[Math.floor(x*step)]/128-1;
    const y=Math.round(h/2+sample*(h*.39));
    if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
}

function paint(){
  if(visMode==="spectrum") drawSpectrum(); else drawScope();
  requestAnimationFrame(paint);
}
requestAnimationFrame(paint);

async function loadExactFallbackArt(){
  if(headArt.src) return;
  try{
    const mod=await import("https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm");
    const JSZip=mod.default;
    const response=await fetch("/skins/HeadAMP.wal",{cache:"no-store"});
    if(!response.ok) throw new Error("WAL HTTP "+response.status);
    const zip=await JSZip.loadAsync(await response.arrayBuffer());
    const file=zip.file("images/head.png");
    if(!file) throw new Error("images/head.png missing");
    const blob=await file.async("blob");
    headObjectUrl=URL.createObjectURL(blob);
    headArt.src=headObjectUrl;
    return;
  }catch(err){
    console.error("Could not extract HeadAMP fallback art",err);
    headArt.style.display="none";
    fallback.style.backgroundImage='url("https://assets.spacecatsamba.com/winamp/images/headamp.png")';
    fallback.style.backgroundRepeat="no-repeat";
    fallback.style.backgroundSize="796px 424px";
    fallback.style.backgroundPosition="-281px -18px";
  }
}

function showFallback(reason){
  fallback.classList.add("visible");
  renderState.textContent="WAL renderer: fallback active"+(reason?" // "+reason:"");
  loadExactFallbackArt();
}

function hideFallback(){
  fallback.classList.remove("visible");
  renderState.textContent="WAL renderer: native HeadAMP active";
}

window.addEventListener("headamp-playlist-changed",e=>renderPlaylist(e.detail));
window.addEventListener("headamp-ready",()=>populatePlaylists());
window.addEventListener("headamp-skin-ready",hideFallback);
window.addEventListener("headamp-skin-failed",()=>showFallback("render failed"));

await import("/headamp-modern.js");
await import("/classic-eq.js");

populatePlaylists();

if(window.__headampPlaylist){
  const list=window.__headampPlaylist.list?.()||[];
  const current=window.__headampPlaylist.current?.();
  const def=list.find(p=>p.id===current)||list[0];
  if(def){
    try{
      const response=await fetch(def.manifest||def.base+"manifest.json",{cache:"no-store"});
      const manifest=await response.json();
      const names=Array.isArray(manifest)?manifest:manifest.tracks;
      renderPlaylist({
        id:def.id,label:def.label,count:names.length,
        tracks:names.map(n=>n.replace(/_Music\.(it|mod|xm|s3m)$/i,"").replace(/_/g," "))
      });
    }catch{}
  }
}

setTimeout(()=>{
  if(window.__headampSkinState!=="ready") showFallback("waiting for native skin");
},3500);

window.addEventListener("beforeunload",()=>{
  if(headObjectUrl) URL.revokeObjectURL(headObjectUrl);
});
</script>
</body>
</html>
