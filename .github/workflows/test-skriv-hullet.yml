name: Test Hullet and League Tracker
on:
  push:
    paths:
      - "site/index.html"
      - "site/hullet.*"
      - "site/jesus-figure.js"
      - "site/tracker/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/test-skriv-hullet.yml"
  pull_request:
    paths:
      - "site/index.html"
      - "site/hullet.*"
      - "site/jesus-figure.js"
      - "site/tracker/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/test-skriv-hullet.yml"
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check site/hullet.js
      - run: node --test tests/*.test.mjs
