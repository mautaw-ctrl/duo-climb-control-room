name: Test Skriv Hullet Frontpage
on:
  push:
    paths:
      - "site/index.html"
      - "site/skriv-hullet.*"
      - "tests/skriv-hullet.test.mjs"
      - ".github/workflows/test-skriv-hullet.yml"
  pull_request:
    paths:
      - "site/index.html"
      - "site/skriv-hullet.*"
      - "tests/skriv-hullet.test.mjs"
      - ".github/workflows/test-skriv-hullet.yml"
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check site/skriv-hullet.js
      - run: node --test tests/skriv-hullet.test.mjs
