name: Build KeeperFX Browser Package

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/keeperfx-browser-build.yml"
      - "site/keeperfx/game-files/data/**"
      - "site/keeperfx/game-files/sound/**"

permissions:
  contents: write

jobs:
  build:
    name: KeeperFX Win32 package for BoxedWine
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Miracle442
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout official KeeperFX
        uses: actions/checkout@v4
        with:
          repository: dkfans/keeperfx
          ref: master
          path: keeperfx-src
          fetch-depth: 0

      - name: Configure KeeperFX C++ toolchain
        uses: dkfans/setup-cpp@master

      - name: KeeperFX build prerequisites
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y build-essential g++-mingw-w64-i686 cmake ninja-build libpng16-16t64 7zip zip

      - name: Build official 32-bit KeeperFX
        working-directory: keeperfx-src
        run: |
          set -eux
          BUILD_NUMBER=$(git rev-list --count HEAD)
          PACKAGE_SUFFIX=Miracle442Browser
          cmake -S . -B out -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/cmake/toolchains/mingw32.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_NUMBER="$BUILD_NUMBER" \
            -DPACKAGE_SUFFIX="$PACKAGE_SUFFIX"
          cmake --build out --target keeperfx -j"$(nproc)"
          make BUILD_NUMBER="$BUILD_NUMBER" PACKAGE_SUFFIX="$PACKAGE_SUFFIX" pkg-assemble
          cmake --install out --prefix dist

      - name: Add owned DK1 compatibility assets
        run: |
          set -eux
          mkdir -p keeperfx-src/dist/data keeperfx-src/dist/sound
          cp -av site/keeperfx/game-files/data/. keeperfx-src/dist/data/
          cp -av site/keeperfx/game-files/sound/. keeperfx-src/dist/sound/

      - name: Inspect browser payload
        run: |
          set -eux
          find keeperfx-src/dist -maxdepth 2 -type f -printf '%s %p\n' | sort -n > keeperfx-browser-files.txt
          du -sh keeperfx-src/dist
          tail -n 80 keeperfx-browser-files.txt

      - name: Build BoxedWine application ZIP
        run: |
          set -eux
          cd keeperfx-src/dist
          zip -r -9 ../../keeperfx-browser.zip .
          cd ../..
          ls -lh keeperfx-browser.zip
          test -f keeperfx-src/dist/keeperfx.exe

      - name: Upload browser package
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-browser-package
          path: |
            keeperfx-browser.zip
            keeperfx-browser-files.txt
          retention-days: 7
          compression-level: 0

      - name: Fetch BoxedWine WebAssembly runtime
        run: |
          set -eux
          rm -rf browser-release
          mkdir -p browser-release
          BASE="https://www.boxedwine.org/boxedwine"
          for f in boxedwine.js boxedwine.wasm boxedwine-shell.js browserfs.boxedwine.js jszip.min.js; do
            curl --fail --location --retry 3 "$BASE/build/default/$f" -o "browser-release/$f"
          done
          curl --fail --location --retry 3 "$BASE/apps/wine1.7.55-v8-min-online.zip" \
            -o browser-release/wine1.7.55-v8-min-online.zip
          curl --fail --location --retry 3 "$BASE/fs/fullWine1.7.55-v8.zip" \
            -o browser-release/fullWine1.7.55-v8.zip
          cp keeperfx-browser.zip browser-release/
          ls -lh browser-release/
          test "$(stat -c%s browser-release/boxedwine.wasm)" -gt 100000
          test "$(stat -c%s browser-release/fullWine1.7.55-v8.zip)" -gt 10000000

      - name: Publish free browser runtime assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          TAG="keeperfx-browser-runtime"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "KeeperFX Browser Runtime" \
              --notes "Miracle442 browser runtime: official KeeperFX Win32 build + BoxedWine WebAssembly runtime. Rebuilt automatically from source."
          fi
          gh release upload "$TAG" browser-release/* --clobber

      - name: Publish same-origin runtime into Miracle442 site
        run: |
          set -eux
          rm -rf site/keeperfx/runtime-web
          mkdir -p site/keeperfx/runtime-web
          cp -av browser-release/. site/keeperfx/runtime-web/
          printf '%s\n' 'Generated by Build KeeperFX Browser Package. Do not edit manually.' > site/keeperfx/runtime-web/README.txt

      - name: Commit same-origin KeeperFX runtime
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/keeperfx/runtime-web
          if git diff --cached --quiet; then
            echo "KeeperFX runtime unchanged"
            exit 0
          fi
          git commit -m "Publish KeeperFX browser runtime"
          git pull --rebase origin main
          git push origin HEAD:main
