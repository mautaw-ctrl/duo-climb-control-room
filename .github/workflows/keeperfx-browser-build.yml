name: Build KeeperFX Browser Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keeperfx-browser-build.yml"
      - "scripts/prepare-keeperfx-browser.py"
      - "scripts/patch-boxedwine-shell.py"
      - "scripts/split-boxedwine-root.py"
      - "site/keeperfx/game-files/data/**"
      - "site/keeperfx/game-files/sound/**"

permissions:
  contents: write

concurrency:
  group: keeperfx-browser-package
  cancel-in-progress: false

jobs:
  build:
    name: Complete KeeperFX package for BoxedWine
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Miracle442
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip curl

      - name: Download official complete KeeperFX 1.3.2 release
        run: |
          curl --fail --location --retry 3 \
            https://github.com/dkfans/keeperfx/releases/download/v1.3.2/keeperfx_1_3_2_complete.7z \
            -o keeperfx-complete.7z
          mkdir -p keeperfx-dist
          7z x -y -okeeperfx-dist keeperfx-complete.7z > keeperfx-extraction.txt
          test -f keeperfx-dist/keeperfx.exe
          test -f keeperfx-dist/campgns/keeporig/map00001.slb

      - name: Prepare complete browser game with uploaded compatibility assets
        run: |
          python3 scripts/prepare-keeperfx-browser.py \
            keeperfx-dist site/keeperfx/game-files keeperfx-browser.zip

      - name: Fetch BoxedWine WebAssembly runtime
        run: |
          mkdir -p browser-release
          BASE="https://www.boxedwine.org/boxedwine"
          for f in boxedwine.js boxedwine.wasm boxedwine-shell.js browserfs.boxedwine.js jszip.min.js; do
            curl --fail --location --retry 3 "$BASE/build/default/$f" -o "browser-release/$f"
          done
          curl --fail --location --retry 3 "$BASE/apps/wine1.7.55-v8-min-online.zip" \
            -o browser-release/wine1.7.55-v8-min-online.zip
          curl --fail --location --retry 3 "$BASE/fs/fullWine1.7.55-v8.zip" \
            -o browser-release/fullWine1.7.55-v8.zip
          cp keeperfx-browser.zip browser-release/
          python3 scripts/patch-boxedwine-shell.py browser-release/boxedwine-shell.js
          test "$(stat -c%s browser-release/boxedwine.wasm)" -gt 100000

      - name: Upload complete browser package
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-browser-package
          path: keeperfx-browser.zip
          retention-days: 7
          compression-level: 0

      - name: Publish same-origin browser runtime
        run: |
          rm -rf site/keeperfx/runtime-web
          mkdir -p site/keeperfx/runtime-web
          cp -a browser-release/. site/keeperfx/runtime-web/
          # Both archives are split below the per-file static asset cap.
          python3 scripts/split-boxedwine-root.py site/keeperfx/runtime-web/fullWine1.7.55-v8.zip 8388608
          python3 scripts/split-boxedwine-root.py site/keeperfx/runtime-web/keeperfx-browser.zip 8388608
          printf '%s\n' 'Official complete KeeperFX 1.3.2 (SDL2) and BoxedWine WASM. All campaigns and maps included. ZIP files are served as same-origin 8 MiB chunks.' > site/keeperfx/runtime-web/README.txt

      - name: Commit hosted KeeperFX runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/keeperfx/runtime-web
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish complete KeeperFX 1.3.2 browser game and Wine runtime"
          git pull --rebase origin main
          git push origin HEAD:main
