<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Winamp Skins</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#c0c0c0;font:12px "MS Sans Serif",Tahoma,Arial,sans-serif;color:#000}
body{display:flex;flex-direction:column;padding:5px}
.toolbar{border:2px solid;border-color:#fff #404040 #404040 #fff;padding:4px;display:flex;gap:5px;align-items:center}
.path{flex:1;background:#fff;border:2px inset #ddd;padding:3px 5px}
.folder{flex:1;min-height:0;margin-top:5px;background:#fff;border:2px inset #ddd;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));align-content:start;gap:10px}
.skin{border:1px solid transparent;background:#fff;text-align:center;padding:5px;cursor:pointer;min-height:76px}
.skin:hover,.skin.selected{background:#000080;color:#fff;border-color:#000080}
.icon{font-size:30px;line-height:36px}
.name{font-size:11px;line-height:1.15;word-break:break-word}
.status{margin-top:5px;border:2px inset #ddd;background:#c0c0c0;padding:3px 6px}
button{font:12px "MS Sans Serif",Tahoma,Arial,sans-serif;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:3px 8px}
button:active{border-color:#404040 #fff #fff #404040}
</style>
</head>
<body>
<div class="toolbar">
  <div class="path">C:\Program Files\Winamp\Skins\</div>
  <button id="random">Install Random Skin</button>
</div>
<div class="folder" id="folder"></div>
<div class="status" id="status">Loading skins...</div>
<script type="module">
const skins=await fetch("/winamp-skins/skins.json",{cache:"no-store"}).then(r=>r.json());
const folder=document.getElementById("folder");
const status=document.getElementById("status");
let selected=-1;

function install(index){
  const [name,url]=skins[index];
  selected=index;
  localStorage.setItem("miracle442-winamp-skin",url);
  [...folder.children].forEach((x,i)=>x.classList.toggle("selected",i===index));
  status.textContent=name+".wsz installed // Winamp will switch immediately if open";
  parent.postMessage({type:"m442-winamp-skin",url,name},"*");
}

skins.forEach(([name],index)=>{
  const el=document.createElement("button");
  el.className="skin";
  el.innerHTML='<div class="icon">🎨</div><div class="name"></div>';
  el.querySelector(".name").textContent=name+".wsz";
  el.onclick=()=>{selected=index;[...folder.children].forEach((x,i)=>x.classList.toggle("selected",i===index));status.textContent=name+".wsz // double-click to install"};
  el.ondblclick=()=>install(index);
  folder.appendChild(el);
});

document.getElementById("random").onclick=()=>install(Math.floor(Math.random()*skins.length));
status.textContent=skins.length+" skins // double-click to install // or select skins directly inside Winamp";
</script>
</body>
</html>
