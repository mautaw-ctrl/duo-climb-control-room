<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeadAMP Desktop Audio</title>
<link rel="stylesheet" href="/vendor/webamp-modern/css/webamp.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
body{font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;user-select:none}
#headampModernHost{position:absolute;inset:0;z-index:20;pointer-events:none}
#headampModernHost>*{pointer-events:auto}
#headampModernHost ui-root,#headampModernHost [id^="ui-root-"]{pointer-events:auto}
#classicEqHost{position:absolute;left:770px;top:12px;width:275px;height:116px;z-index:30}
#headampModernStatus{position:absolute;left:770px;top:135px;z-index:31;padding:3px 6px;background:#000;color:#8cff61;border:1px solid #4d8d35;font:10px Consolas,monospace;max-width:270px}
#headampModernStatus.ok{opacity:.65}
#headampModernStatus.error{color:#ff9696;border-color:#aa3333}
#playlistLibrary{position:absolute;left:770px;top:170px;width:260px;z-index:32;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:2px 2px #0006;color:#000;font-size:11px}
#playlistLibrary .bar{height:19px;background:#000080;color:#fff;font-weight:bold;padding:2px 4px;display:flex;align-items:center;justify-content:space-between}
#playlistLibrary .body{padding:6px}
#playlistLibrary select,#playlistLibrary button{font:11px "MS Sans Serif",Tahoma,Arial,sans-serif}
#playlistLibrary select{width:100%;height:23px;margin-bottom:5px;background:#fff}
#playlistLibrary button{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:2px 7px;min-height:23px}
#playlistLibrary button:active{border-color:#404040 #fff #fff #404040}
#playlistTracks{height:112px;overflow:auto;background:#fff;border:2px inset #ddd;margin-top:6px;padding:2px}
.track{display:block;width:100%;text-align:left;border:0!important;background:#fff!important;color:#000;padding:2px 3px!important;min-height:18px!important}
.track:hover{background:#000080!important;color:#fff!important}
#visControls{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
#playlistMeta{margin-top:4px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#folderDrop{margin-top:6px;padding:6px;background:#fff;border:2px inset #ddd;text-align:center;color:#333}
#folderDrop.drag{background:#000080;color:#fff}
#folderPicker{display:none}
</style>
</head>
<body>
<div id="headampModernHost"></div>
<div id="classicEqHost"></div>
<div id="headampModernStatus">HEADAMP MODERN // STARTING...</div>

<div id="playlistLibrary">
  <div class="bar"><span>HeadAMP Playlist Library</span><span>♪</span></div>
  <div class="body">
    <select id="playlistSelect" aria-label="Playlist"></select>
    <div id="playlistMeta">Waiting for HeadAMP...</div>
    <div id="playlistTracks"></div>
    <div id="visControls">
      <button id="visSpectrum">Spectrum</button>
      <button id="visScope">Oscilloscope</button>
      <button id="visCycle">Cycle</button>
      <button id="folderButton">Load Folder...</button>
    </div>
    <div id="folderDrop">Drop a folder of .IT / .MOD / .XM / .S3M here</div>
    <input id="folderPicker" type="file" multiple webkitdirectory>
  </div>
</div>

<script type="module">
const select=document.getElementById("playlistSelect");
const tracks=document.getElementById("playlistTracks");
const meta=document.getElementById("playlistMeta");
const folderPicker=document.getElementById("folderPicker");
const folderDrop=document.getElementById("folderDrop");

function renderPlaylist(detail){
  meta.textContent=(detail.label||detail.id)+" // "+detail.count+" tracks";
  tracks.innerHTML="";
  (detail.tracks||[]).forEach((name,index)=>{
    const b=document.createElement("button");
    b.className="track";
    b.textContent=String(index+1).padStart(2,"0")+"  "+name;
    b.onclick=()=>window.__headampPlaylist?.play(index);
    tracks.appendChild(b);
  });
}

window.addEventListener("headamp-playlist-changed",e=>renderPlaylist(e.detail));
window.addEventListener("headamp-ready",()=>{
  const api=window.__headampPlaylist;
  const list=api?.list?.()||[];
  select.innerHTML="";
  list.forEach(p=>{
    const o=document.createElement("option");
    o.value=p.id;o.textContent=p.label||p.id;select.appendChild(o);
  });
  select.value=api?.current?.()||list[0]?.id||"";
});
select.onchange=()=>window.__headampPlaylist?.load(select.value,false);

document.getElementById("visSpectrum").onclick=()=>window.__headampVis?.spectrum();
document.getElementById("visScope").onclick=()=>window.__headampVis?.oscilloscope();
document.getElementById("visCycle").onclick=()=>window.__headampVis?.cycle();

async function loadLocalFiles(files){
  if(!files?.length) return;
  const first=files[0];
  const rel=first.webkitRelativePath||"";
  const label=rel.includes("/") ? rel.split("/")[0] : "Local Playlist";
  try{
    const count=await window.__headampPlaylist?.loadFiles(files,label,false);
    if(count){
      select.value="";
      meta.textContent=label+" // "+count+" local tracks";
    }
  }catch(err){
    meta.textContent="LOAD ERROR // "+(err?.message||err);
  }
}
document.getElementById("folderButton").onclick=()=>folderPicker.click();
folderPicker.onchange=()=>loadLocalFiles(folderPicker.files);
for(const type of ["dragenter","dragover"]){
  folderDrop.addEventListener(type,e=>{e.preventDefault();folderDrop.classList.add("drag");});
}
for(const type of ["dragleave","drop"]){
  folderDrop.addEventListener(type,e=>{e.preventDefault();folderDrop.classList.remove("drag");});
}
folderDrop.addEventListener("drop",e=>loadLocalFiles(e.dataTransfer.files));

await import("/headamp-modern.js");
await import("/classic-eq.js");

if(window.__headampPlaylist){
  const list=window.__headampPlaylist.list();
  select.innerHTML="";
  list.forEach(p=>{
    const o=document.createElement("option");
    o.value=p.id;o.textContent=p.label||p.id;select.appendChild(o);
  });
  select.value=window.__headampPlaylist.current()||list[0]?.id||"";
}
</script>
</body>
</html>
