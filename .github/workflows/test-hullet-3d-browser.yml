name: Browser smoke test for Hullet Three.js studios

on:
  push:
    branches: [main]
    paths:
      - "site/hullet-lab/instancing/**"
      - "site/hullet-lab/head/**"
      - "site/hullet-lab/vendor/**"
      - "scripts/verify-hullet-browser.mjs"
      - ".github/workflows/test-hullet-3d-browser.yml"
  workflow_dispatch:

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chrome test dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Launch local Pages-equivalent server and test the rendering
        run: |
          set -eu
          python3 -m http.server 8181 --bind 127.0.0.1 --directory site >/tmp/hullet-browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8181/hullet-lab/instancing/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-hullet-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hullet-browser-screenshots
          path: /tmp/hullet-browser-screenshots/*.png
          if-no-files-found: ignore
