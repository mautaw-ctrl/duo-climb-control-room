name: Build Miracle442 OS

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/win98-web/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Windows 98 Web Edition
        run: npm run build:win98

      - name: Commit generated Win98 site
        shell: bash
        run: |
          if git diff --quiet -- site/win98-web; then
            echo "No generated Win98 changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/win98-web
          git commit -m "Build Miracle442 OS with App Store"
          git push
