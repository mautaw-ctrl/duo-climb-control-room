name: Test Fladbroed 3D homepage
on:
  push:
    branches: [main]
    paths:
      - "site/fladbroed/**"
      - "src/index.js"
      - "tests/fladbroed.test.mjs"
      - "scripts/verify-fladbroed-browser.mjs"
      - ".github/workflows/test-fladbroed.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate routing and default model
        run: node --test tests/fladbroed.test.mjs
      - name: Install browser test
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test the site at desktop and mobile sizes
        run: |
          set -eu
          python3 -m http.server 8181 --bind 127.0.0.1 --directory site >/tmp/fladbroed-test-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8181/fladbroed/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-fladbroed-browser.mjs
